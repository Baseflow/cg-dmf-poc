<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>DMF Documentatie</title>
  <link rel="stylesheet" href="/docs/vue.css"/>
  <style>
    body, .sidebar { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    code, pre, .markdown-section code, .markdown-section pre { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .markdown-section img { max-height: 400px; width: auto; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'DMF POC',
      basePath: '/docs/',
      loadSidebar: true,
      homepage: 'home.md',
      subMaxLevel: 2,
      noCompileLinks: ['/docs/swaggerui/.*', '/docs/openapi/.*'],
    }
  </script>
  <script src="/docs/docsify.min.js"></script>
</body>
</html>
