#
# Local development overrides — loaded automatically by Docker Compose when
# running plain `docker compose up`. Not included when -f flags are used
# explicitly (e.g. the k6 or integration-test compose files).

name: cg-dmf-poc

services:
  postgres:
    ports:
      - '5432:5432'

  app:
    hostname: drc.baseflow.local
    ports:
      - '8083:8083'
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8083}
      BASE_URL: ${BASE_URL:-'http://drc.baseflow.local:8083/'}
      OPENZAAK_ENDPOINT: ${OPENZAAK_ENDPOINT:-}
      OPENZAAK_CLIENT_ID: ${OPENZAAK_CLIENT_ID:-}
    networks:
      - default
      - wopi-network

  minio:
    ports:
      - '9000:9000'
      - '9001:9001'

  keycloak:
    ports:
      - '8082:8080'

  azurite:
    ports:
      - '10000:10000'
      - '10001:10001'
      - '10002:10002'

  admin-portal:
    ports:
      - '3000:3000'

  notificaties-api:
    ports:
      - '8000:8000'

networks:
  wopi-network:
    external: true

