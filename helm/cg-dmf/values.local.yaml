# Local test values for Docker Desktop Kubernetes.
# Dependencies (postgres, minio, keycloak) run via docker-compose and are
# reachable from Kubernetes pods at host.docker.internal.
#
# Usage:
#   helm install cg-dmf ./helm/cg-dmf -f helm/cg-dmf/values.local.yaml \
#     --namespace cg-dmf --create-namespace

image:
  # Use the locally built image (built by: docker build -t cg-dmf-poc:local .)
  repository: cg-dmf-poc
  tag: local
  # Must be Never so Kubernetes uses the local Docker image instead of pulling
  pullPolicy: Never

settings:
  baseUrl: "http://localhost:8080"
  oidcIssuer: "http://host.docker.internal:8081/realms/cg-dmf"
  zgwAllowedClientIds: "cg-dmf"  # override: token uses client_id=cg-dmf locally

  database:
    url: "jdbc:postgresql://host.docker.internal:5432/documenten"
    username: "documenten"
    password: "documenten"

  s3:
    endpoint: "http://host.docker.internal:9000"
    bucket: "default-bucket"
    accessKey: "minioadmin"
    secretKey: "minioadmin"

  openzaak:
    endpoint: "http://host.docker.internal:8081"
    clientId: "cg-dmf"
    clientSecret: "dummy"
    validationEnabled: false

# Expose the app on NodePort 30080 so you can reach it at localhost:30080
service:
  type: NodePort
  port: 80
  nodePort: 30080

ingress:
  enabled: false

# No resource limits needed locally
resources: {}

# Relax probes for local startup — JVM cold start can be slow on first build
startupProbe:
  httpGet:
    path: /health/liveness
    port: http
  failureThreshold: 60
  periodSeconds: 5


