{{- if and .Values.adminPortal.enabled .Values.adminPortal.ingress.enabled }}
{{- $fullName := include "cg-dmf.adminPortal.fullname" . }}
{{- $svcPort := .Values.adminPortal.service.port }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cg-dmf.adminPortal.labels" . | nindent 4 }}
  {{- with .Values.adminPortal.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.adminPortal.ingress.ingressClassName }}
  ingressClassName: {{ .Values.adminPortal.ingress.ingressClassName }}
  {{- end }}
  {{- if .Values.adminPortal.ingress.tls }}
  tls:
    {{- range .Values.adminPortal.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.adminPortal.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "ImplementationSpecific" }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}

