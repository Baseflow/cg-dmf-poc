{{- if .Values.adminPortal.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cg-dmf.adminPortal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cg-dmf.adminPortal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.adminPortal.service.type }}
  ports:
    - port: {{ .Values.adminPortal.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.adminPortal.service.type "NodePort") .Values.adminPortal.service.nodePort }}
      nodePort: {{ .Values.adminPortal.service.nodePort }}
      {{- end }}
  selector:
    {{- include "cg-dmf.adminPortal.selectorLabels" . | nindent 4 }}
{{- end }}

