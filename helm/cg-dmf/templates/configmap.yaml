apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cg-dmf.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cg-dmf.labels" . | nindent 4 }}
data:
  # Application
  BASE_URL: {{ .Values.settings.baseUrl | quote }}
  # Database (non-sensitive)
  {{- if .Values.settings.database.poolSize }}
  DB_POOL_SIZE: {{ .Values.settings.database.poolSize | quote }}
  {{- end }}
  # Authentication
  OIDC_ISSUER: {{ .Values.settings.oidcIssuer | quote }}
  # Blob storage (primary repository — index 1)
  BLOB_STORAGE_NAME1: {{ .Values.settings.blobStorage.name | quote }}
  BLOB_STORAGE_TYPE1: {{ .Values.settings.blobStorage.type | quote }}
  BLOB_STORAGE_URL1: {{ .Values.settings.blobStorage.url | quote }}
  BLOB_STORAGE_BUCKET1: {{ .Values.settings.blobStorage.bucket | quote }}
  {{- if .Values.settings.blobStorage.region }}
  BLOB_STORAGE_REGION1: {{ .Values.settings.blobStorage.region | quote }}
  {{- end }}
  BLOB_STORAGE_DISABLE_CHECKSUMS1: {{ .Values.settings.blobStorage.disableChecksums | quote }}
  BLOB_STORAGE_DISABLE_CHUNKED_ENCODING1: {{ .Values.settings.blobStorage.disableChunkedEncoding | quote }}
  # OpenZaak (non-sensitive)
  OPENZAAK_ENDPOINT: {{ .Values.settings.openzaak.endpoint | quote }}
  OPENZAAK_CLIENT_ID: {{ .Values.settings.openzaak.clientId | quote }}
  OPENZAAK_VALIDATION_ENABLED: {{ .Values.settings.openzaak.validationEnabled | quote }}
