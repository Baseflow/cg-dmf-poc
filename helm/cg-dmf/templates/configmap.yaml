apiVersion: v1
kind: ConfigMap
metadata:
  name: { { include "cg-dmf.fullname" . } }
  namespace: { { .Release.Namespace } }
  labels: { { - include "cg-dmf.labels" . | nindent 4 } }
data:
  # Application
  BASE_URL: { { .Values.settings.baseUrl | quote } }
  # Authentication
  OIDC_ISSUER: { { .Values.settings.oidcIssuer | quote } }
  ZGW_ALLOWED_CLIENT_IDS:
    {
      {
        required "settings.zgwAllowedClientIds is required" .Values.settings.zgwAllowedClientIds | quote,
      },
    }
  # S3 / MinIO (non-sensitive) — env var names kept as S3_* until app is migrated to S3_*
  S3_ENDPOINT: { { .Values.settings.s3.endpoint | quote } }
  S3_BUCKET: { { .Values.settings.s3.bucket | quote } }
  S3_DISABLE_CHECKSUMS: { { .Values.settings.s3.disableChecksums | quote } }
  S3_DISABLE_CHUNKED_ENCODING:
    { { .Values.settings.s3.disableChunkedEncoding | quote } }
  # OpenZaak (non-sensitive)
  OPENZAAK_ENDPOINT: { { .Values.settings.openzaak.endpoint | quote } }
  OPENZAAK_CLIENT_ID: { { .Values.settings.openzaak.clientId | quote } }
  OPENZAAK_VALIDATION_ENABLED:
    { { .Values.settings.openzaak.validationEnabled | quote } }
