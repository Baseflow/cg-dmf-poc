# Default values for cg-dmf.
# Override per environment with -f <env-values.yaml> or --set key=value.

# -- Number of pod replicas.
replicaCount: 1

image:
  # -- Container image repository.
  repository: baseflow.azurecr.io/cg-dmf-poc
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag. Defaults to the chart's appVersion.
  tag: ""

# -- Image pull secrets (list of secret names).
imagePullSecrets: []

# -- Override the chart name used in resource names.
nameOverride: ""
# -- String to fully override cg-dmf.fullname.
fullnameOverride: ""

serviceAccount:
  # -- Whether to create a dedicated ServiceAccount.
  create: true
  # -- Annotations to add to the ServiceAccount.
  annotations: {}
  # -- Name of the ServiceAccount to use. Auto-generated when empty.
  name: ""

# -- Annotations added to every pod.
podAnnotations: {}

# -- Labels added to every pod.
podLabels: {}

# -- Pod-level security context.
podSecurityContext:
  fsGroup: 1000

# -- Container-level security context.
securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  # -- Kubernetes Service type.
  type: ClusterIP
  # -- Port exposed by the Service.
  port: 80
  # -- NodePort to use when service.type is NodePort. Leave unset for a random port.
  nodePort: null

ingress:
  # -- Enable Ingress resource creation.
  enabled: false
  # -- Ingress class name.
  ingressClassName: "nginx"
  # -- Ingress annotations.
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-body-size: "4096m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  # cert-manager.io/cluster-issuer: letsencrypt-production
  hosts:
    - host: cg-dmf.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- TLS configuration for the Ingress.
  tls: []
  #  - secretName: cg-dmf-tls-secret
  #    hosts:
  #      - cg-dmf.example.com

# -- Resources for cg-dmf. We recommend not setting defaults so this is a conscious choice per environment.
resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
#   memory: 256Mi

startupProbe:
  httpGet:
    path: /health/liveness
    port: http
  # -- Allow up to 5 minutes for the app to start (30 * 10s).
  failureThreshold: 30
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health/liveness
    port: http
  periodSeconds: 30
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/readiness
    port: http
  periodSeconds: 20
  failureThreshold: 3

autoscaling:
  # -- Enable Horizontal Pod Autoscaler.
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# -- Node selector for pod placement.
nodeSelector: {}

# -- Tolerations for pod placement.
tolerations: []

# -- Affinity rules for pod placement.
affinity: {}

# -- Topology spread constraints for pod placement.
topologySpreadConstraints: []
# e.g:
# topologySpreadConstraints:
#   - maxSkew: 1
#     topologyKey: kubernetes.io/hostname
#     whenUnsatisfiable: DoNotSchedule
#     labelSelector:
#       matchLabels:
#         app.kubernetes.io/name: cg-dmf

# -- Array with extra environment variables to add to the container.
extraEnvVars: []
# e.g:
# extraEnvVars:
#   - name: FOO
#     value: "bar"

# -- Optionally specify extra list of additional volumes for the pod.
extraVolumes: []
# e.g:
# extraVolumes:
#   - name: extra-certs
#     configMap:
#       name: extra-certs

# -- Optionally specify extra list of additional volumeMounts for the container.
extraVolumeMounts: []
# e.g:
# extraVolumeMounts:
#   - name: extra-certs
#     mountPath: /etc/ssl/certs/extra-certs/

# ---------------------------------------------------------------------------
# Application configuration
# ---------------------------------------------------------------------------

settings:
  # -- Public base URL of the API (used in self-links returned by the API).
  baseUrl: "https://cg-dmf.example.com"

  # -- OIDC issuer URL for JWT validation.
  oidcIssuer: "https://auth.example.com/realms/valtimo"
  # ---------------------------------------------------------------------------
  # Encryption (at-rest secrets for blob storage credentials)
  # ---------------------------------------------------------------------------
  encryption:
    # -- Name of an existing Secret containing encryption keys (keys: ENCRYPTION_SECRET_KEY, ENCRYPTION_SALT).
    # When set, the chart will not create a Secret and will reference this name instead.
    # Leave empty/null to let the chart manage the Secret (named <fullname>-encryption).
    existingSecret: null
    # -- Passphrase used for AES-256-PBE-GCM encryption of stored credentials.
    # Generate with: openssl rand -base64 32
    # @sensitive
    secretKey: ""
    # -- Hex-encoded salt for key derivation (must be valid hex, e.g. 16+ hex characters).
    # Generate with: openssl rand -hex 8
    # @sensitive
    salt: ""

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  database:
    # -- Name of an existing Secret containing database credentials (keys: DB_URL, DB_USER, DB_PASSWORD).
    # When set, the chart will not create a Secret and will reference this name instead.
    # Leave empty/null to let the chart manage the Secret (named <fullname>-database).
    existingSecret: null
    # -- JDBC connection URL.
    url: "jdbc:postgresql://postgres:5432/documenten"
    # -- Database username.
    username: "documenten"
    # -- Database password.
    # @sensitive
    password: ""
    # -- Maximum number of connections in the HikariCP pool. Leave null to use the application default (10).
    poolSize: null

  # ---------------------------------------------------------------------------
  # Blob storage (primary repository, mapped to BLOB_STORAGE_*1 env vars)
  # Use extraEnvVars to configure additional repositories (BLOB_STORAGE_*2, etc.)
  # ---------------------------------------------------------------------------
  blobStorage:
    # -- Name of an existing Secret containing blob storage credentials (keys: BLOB_STORAGE_ACCESS_KEY1, BLOB_STORAGE_SECRET_KEY1).
    # When set, the chart will not create a Secret and will reference this name instead.
    # Leave empty/null to let the chart manage the Secret (named <fullname>-blob-storage).
    existingSecret: null
    # -- Human-readable repository name shown in logs.
    name: "default"
    # -- Storage type. Supported values: S3, "Azure Blob Storage".
    type: "S3"
    # -- Endpoint URL of the blob storage service (S3: http://minio:9000, Azure: https://<account>.blob.core.windows.net).
    url: "http://minio:9000"
    # -- Bucket (S3) or container (Azure) name used to store document files.
    bucket: "cg-dmf"
    # -- Access key (S3) or account name (Azure).
    accessKey: ""
    # -- Secret key (S3) or account key (Azure).
    # @sensitive
    secretKey: ""
    # -- Region (S3 only, optional).
    region: ""
    # -- Disable automatic request/response checksum negotiation (S3 only).
    # Set to true when the S3-compatible endpoint does not support AWS checksum extensions.
    disableChecksums: false
    # -- Disable chunked encoding on S3 requests (S3 only).
    # Set to true when the S3 endpoint is behind a proxy (e.g. an S3-proxy service) that does not
    # support chunked transfer encoding. When enabled, the SDK switches from a streaming body to
    # AsyncRequestBody.fromInputStream, which reads and hashes the full payload before sending —
    # this disables true file streaming and increases memory pressure for large uploads.
    disableChunkedEncoding: false

  # ---------------------------------------------------------------------------
  # OpenZaak integration
  # ---------------------------------------------------------------------------
  openzaak:
    # -- Name of an existing Secret containing OpenZaak credentials (key: OPENZAAK_CLIENT_SECRET).
    # When set, the chart will not create a Secret and will reference this name instead.
    # Leave empty/null to let the chart manage the Secret (named <fullname>-openzaak).
    existingSecret: null
    # -- OpenZaak base endpoint URL.
    endpoint: "https://openzaak.example.com"
    # -- OAuth2 / ZGW client ID used to call OpenZaak.
    clientId: "cg-dmf"
    # -- OAuth2 client secret for OpenZaak.
    # @sensitive
    clientSecret: ""
    # -- Whether to validate OpenZaak responses.
    validationEnabled: false

# ---------------------------------------------------------------------------
# Admin Portal (Next.js frontend)
# ---------------------------------------------------------------------------

adminPortal:
  # -- Enable the admin portal deployment.
  enabled: true

  # -- Number of admin portal pod replicas.
  replicaCount: 1

  image:
    # -- Admin portal container image repository.
    repository: baseflow.azurecr.io/cg-dmf-admin-portal
    # -- Image pull policy.
    pullPolicy: IfNotPresent
    # -- Image tag.
    tag: ""

  # -- Annotations added to admin portal pods only.
  podAnnotations: {}

  # -- Pod-level security context for the admin portal.
  podSecurityContext:
    fsGroup: 1000

  # -- Node selector for admin portal pod placement. Falls back to root nodeSelector when empty.
  nodeSelector: {}

  # -- Tolerations for admin portal pod placement. Falls back to root tolerations when empty.
  tolerations: []

  # -- Affinity rules for admin portal pod placement. Falls back to root affinity when empty.
  affinity: {}

  service:
    # -- Kubernetes Service type for admin portal.
    type: ClusterIP
    # -- Port exposed by the Service.
    port: 80
    # -- NodePort to use when service.type is NodePort.
    nodePort: null

  ingress:
    # -- Enable Ingress for the admin portal.
    enabled: false
    # -- Ingress class name.
    ingressClassName: "nginx"
    # -- Ingress annotations.
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    hosts:
      - host: admin.cg-dmf.example.com
        paths:
          - path: /
            pathType: ImplementationSpecific
    # -- TLS configuration.
    tls: []

  # -- Resources for the admin portal container.
  resources: {}

  # -- Array with extra environment variables to add to the admin portal container.
  extraEnvVars: []

  # -- Optionally specify extra volumes for the admin portal pod.
  extraVolumes: []

  # -- Optionally specify extra volume mounts for the admin portal container.
  extraVolumeMounts: []

  settings:
    # -- Name of an existing Secret containing NEXTAUTH_SECRET and KEYCLOAK_CLIENT_SECRET.
    # When set, the chart will not create a Secret for the admin portal.
    existingSecret: null
    # -- Public URL of the admin portal (used by NextAuth for callbacks).
    nextauthUrl: "https://admin.cg-dmf.example.com"
    # -- NextAuth secret key for encrypting session tokens.
    # @sensitive
    nextauthSecret: ""
    # -- Base Keycloak URL without realm path (e.g. https://auth.example.com).
    keycloakUrl: "https://auth.example.com"
    # -- Keycloak realm name.
    keycloakRealm: "valtimo"
    # -- Keycloak OAuth client ID.
    keycloakClientId: "dmf-dashboard"
    # -- Keycloak OAuth client secret.
    # @sensitive
    keycloakClientSecret: ""
    # -- Backend API URL the admin portal proxies requests to.
    backendUrl: "https://cg-dmf.example.com"

