<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DMF PoC — Test Reports</title>
  <style>
    :root { --accent: #0969da; --border: #d0d7de; --bg-header: #f6f8fa; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
           max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
    h1 { margin-bottom: 0.25rem; }
    p.subtitle { color: #656d76; margin-top: 0; }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
    .tab { padding: 0.5rem 1rem; cursor: pointer; border: 1px solid transparent;
           border-bottom: none; margin-bottom: -1px; border-radius: 6px 6px 0 0; }
    .tab:hover { background: var(--bg-header); }
    .tab.active { border-color: var(--border); background: #fff; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid var(--border); padding: 0.5rem 1rem; text-align: left; }
    th { background: var(--bg-header); }
    tr:hover { background: #f6f8fa; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { padding: 2rem; text-align: center; color: #656d76; }
  </style>
</head>
<body>
  <h1>DMF PoC — Test Reports</h1>
  <p class="subtitle">Historical test reports published from CI</p>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
  <script>
    const CATEGORIES = {
      k6:          { label: 'k6 Performance', icon: '\u26a1' },
      integration: { label: 'Integration (Bruno)', icon: '\ud83e\uddea' },
    };
    let manifest = [];
    async function init() {
      try {
        const resp = await fetch('manifest.json');
        if (!resp.ok) throw new Error(resp.statusText);
        manifest = await resp.json();
      } catch(e) {
        document.getElementById('content').innerHTML =
          '<p class="empty">No reports found yet. Run a workflow to generate the first report.</p>';
        return;
      }
      const cats = [...new Set(manifest.map(e => e.category))];
      const orderedCats = Object.keys(CATEGORIES).filter(c => cats.includes(c));
      cats.filter(c => !orderedCats.includes(c)).forEach(c => orderedCats.push(c));
      if (orderedCats.length === 0) {
        document.getElementById('content').innerHTML = '<p class="empty">No reports found yet.</p>';
        return;
      }
      const tabsEl = document.getElementById('tabs');
      orderedCats.forEach(cat => {
        const btn = document.createElement('div');
        const meta = CATEGORIES[cat] || { label: cat, icon: '\ud83d\udcc4' };
        btn.className = 'tab';
        btn.textContent = meta.icon + ' ' + meta.label;
        btn.addEventListener('click', () => showCategory(cat));
        btn.dataset.cat = cat;
        tabsEl.appendChild(btn);
      });
      showCategory(orderedCats[0]);
    }
    function showCategory(cat) {
      document.querySelectorAll('.tab').forEach(t =>
        t.classList.toggle('active', t.dataset.cat === cat));
      const entries = manifest.filter(e => e.category === cat);
      const contentEl = document.getElementById('content');
      if (entries.length === 0) {
        contentEl.innerHTML = '<p class="empty">No reports in this category yet.</p>';
        return;
      }
      let html = '<table><thead><tr><th>Run</th><th>Date</th><th>Report</th></tr></thead><tbody>';
      for (const entry of entries) {
        const date = new Date(entry.date).toLocaleString();
        html += '<tr><td>#' + entry.runNumber + '</td><td>' + date + '</td><td><a href="' + entry.path + '">View report</a></td></tr>';
      }
      html += '</tbody></table>';
      contentEl.innerHTML = html;
    }
    init();
  </script>
</body>
</html>
