services:
  postgres:
    image: postgres:16-alpine
    container_name: dmf-postgres
    environment:
      POSTGRES_DB: documenten
      POSTGRES_USER: documenten
      POSTGRES_PASSWORD: documenten
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documenten"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: dmf-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: documenten
      DATABASE_USER: documenten
      DATABASE_PASSWORD: documenten
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

