<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WOPI Integration API — Swagger UI</title>
  <link rel="stylesheet" href="swagger-ui.css" />
  <link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16" />
</head>
<body>
<div id="swagger-ui"></div>
<script src="swagger-ui-bundle.js"></script>
<script>
  window.onload = function () {
    window.ui = SwaggerUIBundle({
      url: "/docs/openapi/wopi.json",
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIBundle.SwaggerUIStandalonePreset,
      ],
      layout: "BaseLayout",

      // Always show the "Try it out" button
      tryItOutEnabled: true,

      // Remember the Bearer token / OAuth2 login across page refreshes
      persistAuthorization: true,

      // OAuth2 Authorization Code + PKCE — redirect back to this page
      oauth2RedirectUrl: window.location.origin + "/wopi/docs/swaggerui/oauth2-redirect.html",

      // Use PKCE (no client_secret needed in the browser)
      usePkceWithAuthorizationCodeGrant: true,

      // // Pre-fill the OAuth2 client_id with the default Keycloak client
      // initOAuth: {
      //   clientId: "cg-dmf",
      //   scopes: ["openid", "profile", "email"],
      //   usePkceWithAuthorizationCodeGrant: true,
      // },
    });
  };
</script>
</body>
</html>
