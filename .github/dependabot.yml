# Dependabot configuration for automated dependency updates and security alerts
# Documentation: https://docs.github.com/en/code-security/dependabot
version: 2
updates:
  # Gradle dependencies (Kotlin, libraries)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "16:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group non-security updates together
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
        update-types:
          - "minor"
          - "patch"
      ktor:
        patterns:
          - "io.ktor*"
        update-types:
          - "minor"
          - "patch"
      exposed:
        patterns:
          - "org.jetbrains.exposed*"
        update-types:
          - "minor"
          - "patch"
      aws-sdk:
        patterns:
          - "software.amazon.awssdk*"
        update-types:
          - "minor"
          - "patch"
      koin:
        patterns:
          - "io.insert-koin*"
        update-types:
          - "minor"
          - "patch"
      flyway:
        patterns:
          - "org.flywaydb*"
        update-types:
          - "minor"
          - "patch"
    # Allow specific dependencies to be updated more frequently
    allow:
      - dependency-type: "all"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "16:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Docker dependencies (if using Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "16:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "docker"

  # npm dependencies for the frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "16:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    allow:
      - dependency-type: "all"
