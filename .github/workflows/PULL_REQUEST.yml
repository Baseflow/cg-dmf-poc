name: 'Test run for pull requests'
run-name: "Building '${{ github.ref_name}}' by '${{ github.actor }}'"

on:
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    permissions:
      issues: write
    uses: ./.github/workflows/LINT.yml

  helm-lint:
    uses: ./.github/workflows/HELM_LINT.yml

  test:
    uses: ./.github/workflows/TEST.yml
    secrets: inherit

  integration-test:
    needs: [lint, helm-lint, test]
    uses: ./.github/workflows/INTEGRATION_TEST.yml
    secrets: inherit
