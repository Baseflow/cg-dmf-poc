name: 'Integration Tests (Bruno)'

on:
  workflow_call:
    secrets:
      JWT_CLIENT_SECRET:
        required: true
      OPENZAAK_CLIENT_SECRET:
        required: true

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create results directory
        run: mkdir -p build/bruno-results

      - name: Run integration tests via Docker Compose
        env:
          JWT_CLIENT_SECRET: ${{ secrets.JWT_CLIENT_SECRET }}
          OPENZAAK_CLIENT_SECRET: ${{ secrets.OPENZAAK_CLIENT_SECRET }}
          BRUNO_KEEP_ALIVE: 'false'
        run: |
          docker compose -f docker-compose.integration-test.yml up \
            --build \
            --exit-code-from bruno \
            --abort-on-container-exit

      - name: Bring down containers
        env:
          JWT_CLIENT_SECRET: ${{ secrets.JWT_CLIENT_SECRET }}
        if: always()
        run: docker compose -f docker-compose.integration-test.yml down --volumes

      - name: Publish Bruno test results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/build/bruno-results/results.xml'
          detailed_summary: true
          include_passed: true
          include_time_in_summary: true
          check_name: Bruno Integration Tests

      - name: Embed Bruno results in job summary
        if: always()
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, os

          tree = ET.parse("build/bruno-results/results.xml")
          root = tree.getroot()

          suites   = root.findall("testsuite")
          total    = sum(int(s.attrib.get("tests",    0)) for s in suites)
          errors   = sum(int(s.attrib.get("errors",   0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          skipped  = sum(int(s.attrib.get("skipped",  0)) for s in suites)
          passed   = total - errors - failures - skipped

          badge = "✅ All requests passed" if (errors + failures) == 0 else "❌ Some requests failed"

          lines = [
            f"## Bruno Integration Test Results — {badge}",
            "",
            f"| Requests | ✅ Passed | ❌ Failed | ⚠️ Errors | ⏭️ Skipped |",
            f"|----------|-----------|-----------|-----------|-----------|",
            f"| {len(suites)} | {passed} | {failures} | {errors} | {skipped} |",
            "",
            "### Per-request details",
            "",
            "| Request | File | ⏱ Time (s) | Result |",
            "|---------|------|------------|--------|",
          ]

          for s in suites:
            name   = s.attrib.get("name", "")
            file   = s.attrib.get("file", "")
            time   = s.attrib.get("time", "")
            errs   = int(s.attrib.get("errors",   0))
            fails  = int(s.attrib.get("failures", 0))
            result = "❌ Failed" if (errs + fails) > 0 else "✅ Passed"
            lines.append(f"| {name} | `{file}` | {time} | {result} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
            f.write("\n".join(lines) + "\n")
          EOF

      - name: Upload Bruno test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bruno-test-results
          path: |
            build/bruno-results/results.xml
            build/bruno-results/output.html

