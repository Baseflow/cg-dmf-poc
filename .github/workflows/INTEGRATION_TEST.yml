name: 'Integration Tests (Bruno)'

on:
  workflow_call:
    secrets:
      JWT_CLIENT_SECRET:
        required: true
      OPENZAAK_CLIENT_SECRET:
        required: true

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create results directory
        run: mkdir -p build/bruno-results

      - name: Run integration tests via Docker Compose
        env:
          JWT_CLIENT_SECRET: ${{ secrets.JWT_CLIENT_SECRET }}
          OPENZAAK_CLIENT_SECRET: ${{ secrets.OPENZAAK_CLIENT_SECRET }}
          BRUNO_KEEP_ALIVE: 'false'
        run: |
          docker compose -f docker-compose.integration-test.yml up \
            --build \
            --exit-code-from bruno \
            --abort-on-container-exit

      - name: Bring down containers
        env:
          JWT_CLIENT_SECRET: ${{ secrets.JWT_CLIENT_SECRET }}
        if: always()
        run: docker compose -f docker-compose.integration-test.yml down --volumes

      - name: Publish Bruno test results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/build/bruno-results/results.xml'
          detailed_summary: true
          include_passed: true
          include_time_in_summary: true
          check_name: Bruno Integration Tests

      - name: Upload Bruno test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bruno-test-results
          path: |
            build/bruno-results/results.xml
            build/bruno-results/output.html

  deploy-pages:
    name: Publish integration report to GitHub Pages
    needs: integration-test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Bruno results artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: bruno-test-results
          path: bruno-results


      - name: Publish report to gh-pages
        uses: ./.github/actions/publish-report
        with:
          category: integration
          report-file: bruno-results/output.html
          run-id: ${{ github.run_id }}
          run-number: ${{ github.run_number }}
          branch: ${{ github.head_ref || github.ref_name }}
