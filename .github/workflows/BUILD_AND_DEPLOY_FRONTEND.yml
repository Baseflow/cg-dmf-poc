name: 'Build docker container image frontend'

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop-admin-portal # temporary
    paths:
      - 'frontend/admin-portal/**'
      - '.github/workflows/BUILD_AND_DEPLOY_FRONTEND.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/admin-portal/**'
      - '.github/workflows/BUILD_AND_DEPLOY_FRONTEND.yml'

jobs:
  docker-build:
    name: Build docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        name: Checkout

      - name: Get project version from admin-portal package.json file
        id: get_version
        run: |
          VERSION=$(jq -r '.version' frontend/admin-portal/package.json)
          echo "version=$version" >> $GITHUB_OUTPUT

      - uses: ./.github/actions/docker
        name: Build and push to Azure Container Registry
        id: acr
        with:
          username: ${{ secrets.CG_ACR_USERNAME }}
          password: ${{ secrets.CG_ACR_PASSWORD }}
          registry: 'commongroundacr.azurecr.io'
          push: ${{ github.event_name != 'pull_request' }}
          vulnerability_scan: false
          dockerfile: frontend/admin-portal/Dockerfile
          context: frontend/admin-portal
          repository: cg-dmf-admin-portal
          version: ${{ steps.get_version.outputs.version }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Push to Docker Hub
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          SOURCE_TAG="${{ steps.acr.outputs.tag }}"
          DEST_TAG="baseflow/cg-dmf-admin-portal:${SOURCE_TAG##*:}"
          docker tag ${SOURCE_TAG} ${DEST_TAG}
          docker push baseflow/cg-dmf-admin-portal --all-tags

