name: 'Frontend Tests'

on:
  workflow_call:

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/admin-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
