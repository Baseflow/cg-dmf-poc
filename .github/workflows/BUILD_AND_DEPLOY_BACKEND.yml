name: 'Build docker container image backend'

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/BUILD_AND_DEPLOY_BACKEND.yml'

jobs:
  test:
    uses: ./.github/workflows/TEST.yml
    secrets: inherit

  docker-build:
    name: Build docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        name: Checkout

      - name: Patch Helm chart versions
        if: startsWith(github.ref_name, 'release/')
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          sed -i "s/^version:.*/version: ${VERSION}/" helm/cg-dmf/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" helm/cg-dmf/Chart.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/cg-dmf/Chart.yaml
          git commit -m "chore: bump helm chart to ${VERSION}"
          git push

      - uses: ./.github/actions/docker
        name: Build and push to Azure Container Registry
        id: acr
        with:
          username: ${{ secrets.CG_ACR_USERNAME }}
          password: ${{ secrets.CG_ACR_PASSWORD }}
          registry: 'commongroundacr.azurecr.io'
          push: ${{ github.event_name != 'pull_request' }}
          vulnerability_scan: false

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && startsWith(github.ref_name, 'release/')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Push to Docker Hub
        if: github.event_name != 'pull_request' && startsWith(github.ref_name, 'release/')
        shell: bash
        run: |
          SOURCE_TAG="${{ steps.acr.outputs.tag }}"
          DEST_TAG="baseflow/cg-dmf-poc:${SOURCE_TAG##*:}"
          docker tag ${SOURCE_TAG} ${DEST_TAG}
          docker push baseflow/cg-dmf-poc --all-tags

      - name: Create GitHub Release
        if: github.event_name != 'pull_request' && startsWith(github.ref_name, 'release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          if [[ -f RELEASE_NOTES.md ]]; then
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file RELEASE_NOTES.md \
              --target ${{ github.sha }}
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes "Release ${VERSION}." \
              --target ${{ github.sha }}
          fi

      - name: Open PR to merge release into main
        if: github.event_name != 'pull_request' && startsWith(github.ref_name, 'release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          gh pr create \
            --base main \
            --head "${GITHUB_REF_NAME}" \
            --title "Release v${VERSION} → main" \
            --body "Merges release \`${GITHUB_REF_NAME}\` into \`main\` after a successful build and publish of v${VERSION}." \
            || echo "PR already exists, skipping."