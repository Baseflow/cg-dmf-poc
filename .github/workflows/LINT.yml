name: 'Spotless Lint'

on:
  workflow_call:

jobs:
  spotless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Run Spotless check
        id: spotless
        run: ./gradlew spotlessCheck --console=plain --no-daemon
        continue-on-error: true

      - name: Annotate PR with fix instructions
        if: steps.spotless.outcome == 'failure'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const body = [
              '## ⚠️ Spotless lint check failed',
              '',
              'Your code does not match the project\'s formatting rules.',
              'Run the following command locally to automatically fix all issues:',
              '',
              '```bash',
              './gradlew spotlessApply',
              '```',
              '',
              'Then commit the resulting changes and push them to this branch.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail job when Spotless check failed
        if: steps.spotless.outcome == 'failure'
        run: |
          echo "::error::Spotless lint check failed. Run './gradlew spotlessApply' locally to auto-fix, then commit and push."
          exit 1

