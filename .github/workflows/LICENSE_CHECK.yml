name: 'License Check'

on:
  workflow_call:

jobs:
  license-check-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        run: npm run license:check

  license-check-admin-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/admin-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        run: npm run license:check
